<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}" data-theme="auto">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title and page.url != '/' %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0c0e12" media="(prefers-color-scheme: dark)">
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="preload" href="{{ '/assets/fonts/bricolage-grotesque-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ '/assets/fonts/geist-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ '/assets/fonts/geist-mono-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script>
        // Runs before first paint: mark that scripts are available (scroll reveals are gated on the .js class)
        // and apply the stored theme to avoid a flash. "auto" follows the system.
        (function () {
            var root = document.documentElement;
            root.classList.add('js');
            try {
                var t = localStorage.getItem('theme');
                if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t);
            } catch (e) { }
        })();
    </script>
</head>

<body>
    <a class="skip-link" href="#main">Skip to content</a>
    {% include header.html %}

    <main id="main">
        {{ content }}
    </main>

    {% include footer.html %}
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
    {% for s in page.scripts %}<script src="{{ s | relative_url }}" defer></script>{% endfor %}
</body>

</html>
