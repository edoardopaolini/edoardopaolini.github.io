  stage:
    b0_title: "Start with the signal."
    b0_text: "EEG records electrical potentials from 19 electrodes on the scalp. Every trace here is simulated, at 250 samples per second."
    b1_title: "Correlate the channels."
    b1_text: "Correlate every pair and the recording becomes a graph. Electrodes are nodes, edges say how much two channels move together. The edges are computed live from the traces on screen."
    b2_title: "Stimulate and listen."
    b2_text: "TMS-EEG delivers a magnetic pulse and records the cortical response. Press an electrode: the pulse spreads over the graph and the evoked potential appears in the traces."
    desc: "Interactive figure. A top view of a head with the 19 electrodes of the 10-20 EEG system and simulated EEG traces. Activating an electrode delivers a simulated pulse that spreads through the connectivity graph."
    controls_label: "Figure controls"
    caption: "Simulated figures. No patient data."
  sentence: "My doctoral work aims to develop EEG and TMS-EEG systems, built on brain connectomics, for the personalized treatment of epilepsy."
  interests:
    title: "What I work on."
  bench:
    caption: "Simulated signal, real filters."
    controls_label: "Filters"
    notch: "Notch 50 Hz"
    hp: "High-pass 1 Hz"
    lp: "Low-pass 40 Hz"
    desc: "Simulated single-channel EEG trace with a small amplitude spectrum. The switches apply real digital filters to the trace."
  brain:
    caption: "Toy network on the ICBM152 cortical surface."
    desc: "Simulated connectivity graph drawn on a rotating cortical surface, the ICBM152 template, with a patch of the left temporo-parietal cortex highlighted as the candidate epileptogenic zone."
    controls_label: "Cortical sources"
  topo:
    caption: "Four canonical classes, simulated. Blue is negative, red is positive."
    desc: "Simulated scalp voltage topography stepping through the four canonical microstate classes A, B, C and D."
  cell:
    title: "Before the brain, a bacterium."
    text: "For my master's thesis I built a dynamic model of the central carbon metabolism of <i>Mycobacterium tuberculosis</i>: Michaelis-Menten kinetics for the Krebs cycle, the glyoxylate shunt, the methylcitrate cycle and the methylmalonyl pathway."
    text2: "This is a toy version of that network, and the flux runs live. Block or dial down an enzyme, as a drug or a stress would, and watch the carbon find another way, or pile up."
    controls_label: "Perturbations"
    desc: "Interactive figure. The central carbon metabolism of Mycobacterium tuberculosis as a network of metabolites and reactions, with particles flowing along the reactions in proportion to the flux. The buttons perturb one enzyme at a time; the readout describes how the flux reroutes."
    caption: "Toy flux model, not the thesis results."
  toolbox:
    title: "What I build with."
    text: "Hands-on with clinical data since 2019, in academic labs, at Boston Children's Hospital and in a medtech start-up. End-to-end pipelines, from raw signals to predictive models."
