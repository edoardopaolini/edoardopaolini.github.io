  stage:
    b0_title: "Si parte dal segnale."
    b0_text: "L'EEG registra i potenziali elettrici da 19 elettrodi sullo scalpo. Ogni traccia qui è simulata, a 250 campioni al secondo."
    b1_title: "Correla i canali."
    b1_text: "Correlando i canali, la registrazione diventa un grafo. Gli elettrodi sono nodi, gli archi dicono quanto due canali si muovono insieme. Gli archi sono calcolati in diretta dalle tracce sullo schermo."
    b2_title: "Stimola e ascolta."
    b2_text: "La TMS-EEG applica un impulso magnetico e registra la risposta corticale. Premi un elettrodo: l'impulso si propaga sul grafo e il potenziale evocato compare nelle tracce."
    desc: "Figura interattiva. Vista dall'alto di una testa con i 19 elettrodi del sistema EEG 10-20 e tracce EEG simulate. Attivando un elettrodo si applica un impulso simulato che si propaga nel grafo di connettività."
    controls_label: "Controlli della figura"
    caption: "Figure simulate. Nessun dato di pazienti."
  sentence: "Il mio dottorato punta a sviluppare sistemi EEG e TMS-EEG, fondati sulla connettomica cerebrale, per il trattamento personalizzato dell'epilessia."
  interests:
    title: "Di cosa mi occupo."
  bench:
    caption: "Segnale simulato, filtri reali."
    controls_label: "Filtri"
    notch: "Notch 50 Hz"
    hp: "Passa-alto 1 Hz"
    lp: "Passa-basso 40 Hz"
    desc: "Traccia EEG simulata a canale singolo con un piccolo spettro di ampiezza. Gli interruttori applicano filtri digitali reali alla traccia."
  brain:
    caption: "Rete giocattolo sulla superficie corticale ICBM152."
    desc: "Grafo di connettività simulato disegnato su una superficie corticale che ruota, il template ICBM152, con una porzione della corteccia temporo-parietale sinistra evidenziata come zona epilettogena candidata."
    controls_label: "Sorgenti corticali"
  topo:
    caption: "Quattro classi canoniche, simulate. Blu negativo, rosso positivo."
    desc: "Topografia simulata del voltaggio sullo scalpo che alterna le quattro classi canoniche di microstati A, B, C e D."
  cell:
    title: "Prima del cervello, un batterio."
    text: "Per la tesi di laurea magistrale ho costruito un modello dinamico del metabolismo centrale del carbonio di <i>Mycobacterium tuberculosis</i>: cinetiche di Michaelis-Menten per il ciclo di Krebs, lo shunt del gliossilato, il ciclo del metilcitrato e la via del metilmalonile."
    text2: "Questa è una versione giocattolo di quella rete, e il flusso scorre in diretta. Blocca o riduci un enzima, come farebbe un farmaco o uno stress, e guarda il carbonio trovare un'altra strada, o accumularsi."
    controls_label: "Perturbazioni"
    desc: "Figura interattiva. Il metabolismo centrale del carbonio di Mycobacterium tuberculosis come rete di metaboliti e reazioni, con particelle che scorrono lungo le reazioni in proporzione al flusso. I pulsanti perturbano un enzima alla volta; il testo descrive come il flusso si ridistribuisce."
    caption: "Modello di flusso giocattolo, non i risultati della tesi."
  toolbox:
    title: "Con che cosa lavoro."
    text: "Dal 2019 lavoro con dati clinici reali, in laboratori accademici, al Boston Children's Hospital e in una start-up medtech. Pipeline complete, dal segnale grezzo ai modelli predittivi."
  route:
