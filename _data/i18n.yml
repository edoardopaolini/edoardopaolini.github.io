    p2: "I build end-to-end pipelines in Python and MATLAB that take raw biomedical signals (EEG, TMS-EEG, fMRI) through preprocessing, source reconstruction and feature extraction to predictive models, using classical machine learning as well as foundation-model-based methods for tabular data."
