# Strings for assets/js/metabolism.js (the metabolic flux figure of the home page). The two trees must have the
# same keys. The readouts are filled with the numbers the model measures: {shunt} glyoxylate shunt flux, {co2}
# carbon dioxide released, {lipids} PDIM and SL-1 produced, {icd} isocitrate dehydrogenase flux, {mcs}
# methylcitrate synthase flux, each a signed whole percent against the wild type ("+41%", "-100%") that the
# templates keep inside parentheses after a plain verb. {pool} names the metabolites that pile up; when none does,
# the whole sentence holding {pool} is replaced by the nopool sentence. canvas.names are the metabolite labels of
# the figure at wide widths (a newline breaks the three longest); the narrower tiers use the thesis abbreviations.
en:
  buttons:
    icl: "Add 3-nitropropionate"
    pcl: "Inhibit PCL"
    sdh: "Inhibit SDH"
    cs: "Downregulate CS"
    icd: "Phosphorylate ICD"
    restore: "Restore"
  aria:
    icl: "Block isocitrate lyase and methylisocitrate lyase with 3-nitropropionate"
    pcl: "Inhibit propionyl-CoA carboxylase"
    sdh: "Inhibit succinate dehydrogenase"
    cs: "Downregulate citrate synthase"
    icd: "Phosphorylate isocitrate dehydrogenase"
  readouts:
    wild: >-
      Unperturbed. Glucose, fatty acids and cholesterol feed the cycle, and the carbon leaves as carbon dioxide,
      biomass, released succinate and the virulence lipids PDIM and SL-1.
    icl: >-
      3-nitropropionate blocks both isocitrate lyases and methylisocitrate lyase, so the glyoxylate shunt closes
      ({shunt}) and the methylcitrate cycle stops with it. The carbon returns to the decarboxylating branch:
      isocitrate dehydrogenase carries more ({icd}) and more carbon dioxide leaves ({co2}). The shunt was what
      kept those carbons in the cell.
    pcl: >-
      With propionyl-CoA carboxylase inhibited, the methylmalonyl pathway is shut and the virulence lipids PDIM
      and SL-1 are no longer made ({lipids}). Propionyl-CoA has nowhere left to go except the methylcitrate cycle,
      which speeds up ({mcs}), and the rest piles up: {pool}.
    sdh: >-
      Inhibiting succinate dehydrogenase cuts the cycle in two: succinate can no longer reach fumarate, the far
      side of the cycle runs only on what the glyoxylate shunt still delivers, and carbon dioxide falls ({co2}).
      What piles up: {pool}.
    cs: >-
      With citrate synthase downregulated, less acetyl-CoA becomes citrate, the whole cycle slows and carbon
      dioxide falls ({co2}). The oxaloacetate that citrate synthase no longer uses goes to the methylcitrate cycle
      instead, which picks up ({mcs}).
    icd: >-
      Phosphorylated isocitrate dehydrogenase is inactive: that is how the cell switches it off under stress.
      Isocitrate takes the glyoxylate shunt instead ({shunt}), the two decarboxylation steps are bypassed and less
      carbon dioxide leaves ({co2}). The carbon is kept for biosynthesis.
    nopool: "Nothing piles up."
  canvas:
    co2: "CO2"
    inputs:
      glucose: "Glucose"
      fatty: "Fatty acids"
      chol: "Cholesterol"
    pathways:
      glucose: "glycolysis"
      fatty: "beta-oxidation"
      chol: "cholesterol catabolism"
    drains:
      bioA: "Biomass"
      bioO: "Biomass"
      bioK: "Biomass"
      sucOut: "Succinate out"
      lipids: "PDIM and SL-1"
    drainsShort:
      sucOut: "SUC out"
      lipids: "PDIM, SL-1"
    names:
      PYR: "Pyruvate"
      ACA: "Acetyl-CoA"
      PPC: "Propionyl-CoA"
      CIT: "Citrate"
      ICIT: "Isocitrate"
      AKG: "alpha-\nketoglutarate"
      SSA: "Succinic\nsemialdehyde"
      SCA: "Succinyl-CoA"
      SUC: "Succinate"
      FA: "Fumarate"
      MAL: "Malate"
      OAA: "Oxaloacetate"
      GLY: "Glyoxylate"
      MCT: "Methylcitrate"
      MCA: "Methyl-cis-\naconitate"
      MIC: "Methylisocitrate"
      SMC: "(S)-methylmalonyl-CoA"
      RMC: "(R)-methylmalonyl-CoA"
