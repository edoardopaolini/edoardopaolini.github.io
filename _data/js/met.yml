it:
  buttons:
    icl: "Aggiungi 3-nitropropionato"
    pcl: "Inibisci PCL"
    sdh: "Inibisci SDH"
    cs: "Riduci CS"
    icd: "Fosforila ICD"
    restore: "Ripristina"
  aria:
    icl: "Blocca le isocitrato liasi e la metilisocitrato liasi con il 3-nitropropionato"
    pcl: "Inibisci la propionil-CoA carbossilasi"
    sdh: "Inibisci la succinato deidrogenasi"
    cs: "Riduci l'espressione della citrato sintasi"
    icd: "Fosforila l'isocitrato deidrogenasi"
  readouts:
    wild: >-
      Senza perturbazioni. Glucosio, acidi grassi e colesterolo alimentano il ciclo, e il carbonio esce come
      anidride carbonica, biomassa, succinato rilasciato e lipidi di virulenza PDIM e SL-1.
    icl: >-
      Il 3-nitropropionato blocca entrambe le isocitrato liasi e la metilisocitrato liasi: lo shunt del
      gliossilato si chiude ({shunt}) e con esso si ferma il ciclo del metilcitrato. Il carbonio torna sul ramo
      che decarbossila: l'isocitrato deidrogenasi ne porta di più ({icd}) ed esce più anidride carbonica ({co2}).
      Era lo shunt a tenere quei carboni nella cellula.
    pcl: >-
      Con la propionil-CoA carbossilasi inibita, la via del metilmalonile si chiude e i lipidi di virulenza PDIM
      e SL-1 non vengono più prodotti ({lipids}). Al propionil-CoA resta solo il ciclo del metilcitrato, che
      accelera ({mcs}), e il resto si accumula: {pool}.
    sdh: >-
      Inibire la succinato deidrogenasi taglia il ciclo in due: il succinato non arriva più al fumarato, la metà
      a valle vive solo di quello che porta lo shunt del gliossilato e l'anidride carbonica scende ({co2}). Si
      accumula: {pool}.
    cs: >-
      Con la citrato sintasi ridotta, meno acetil-CoA diventa citrato, tutto il ciclo rallenta e l'anidride
      carbonica scende ({co2}). L'ossalacetato che la citrato sintasi non usa più va al ciclo del metilcitrato,
      che ne guadagna ({mcs}).
    icd: >-
      L'isocitrato deidrogenasi fosforilata è inattiva: è così che la cellula la spegne sotto stress. L'isocitrato
      prende invece lo shunt del gliossilato ({shunt}), i due passaggi di decarbossilazione vengono aggirati ed
      esce meno anidride carbonica ({co2}). Il carbonio resta per la biosintesi.
    nopool: "Non si accumula niente."
