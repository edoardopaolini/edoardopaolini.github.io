# Strings of the 3D brain figure (assets/js/brain.js), serialised into window.I18N.brain by the default layout.
# Placeholders in braces are filled by the module. The two trees must have the same keys.
en:
  select: "Select {name}"
  idle: "Drag to rotate. Arrow keys rotate the brain. Select an electrode to see its connections."
  node: "{name}: {n} {links}."
  node_zone: "{name}: {n} {links}, in the candidate zone."
  link_one: "connection"
  link_many: "connections"
  pinned: "{name} pinned."
  released: "{name} released."
it:
  select: "Seleziona {name}"
  idle: "Trascina per ruotare. Le frecce ruotano il cervello. Seleziona un elettrodo per vederne le connessioni."
  node: "{name}: {n} {links}."
  node_zone: "{name}: {n} {links}, nella zona candidata."
  link_one: "connessione"
  link_many: "connessioni"
  pinned: "{name} fissato."
  released: "{name} rilasciato."
